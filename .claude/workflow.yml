# Project manifest for the `flow` plugin (papiroflexia). Every /flow:* command reads this first.
# Schema and defaults: docs/MANIFEST.md in the plugin repo. Validate with: "${CLAUDE_PLUGIN_ROOT}/bin/flow" manifest check
version: 1
name: chadcn-studio

stack: >
  Ruby 4.0 / Rails 8.1 / SQLite (Solid Queue/Cache/Cable), Phlex views (`app/views` under `Views::Base`, `app/components`
  under `Components::Base`), Hotwire (Turbo + Stimulus via importmap, no bundler), Tailwind 4, the chadcn gem as the design
  system (`Chadcn::*` components, `chadcn--*` Stimulus controllers consumed from the gem, the theme in
  `app/assets/tailwind/theme/theme.css` in shadcn format), dry-operation/dry-monads/dry-validation in
  `app/concepts/<domain>/{operation,contract,query,presenter}`, the `anthropic` gem for LLM theme generation (one
  structured call, validated before use), Minitest + Capybara/Cuprite, RuboCop omakase plus rails/performance/minitest/
  rake/capybara, Brakeman, strong_migrations. ONE repository. No Pundit and no authentication in v1; no i18n (English
  only, plain strings are fine). Every surface renders from theme tokens: hardcoded palette classes or literal colors
  outside the theme file are defects (PALETTE_LEAKS).

repos:
  - id: app
    path: .

tracks:
  ruby:
    globs: ["app/**/*.rb", "lib/**/*.rb"]
  templates:
    globs: ["app/views/**/*.erb"]
  stimulus:
    globs: ["app/javascript/**/*.js"]
    exclude: ["**/importmap*", "**/vendor/**/*"]
    gem_prefixes: ["chadcn--"]
  slice: view
  tests:
    framework: minitest
    globs: ["test/**/*.rb"]
    mirror: "test/{dir}/{base}_test.rb"
  house_only: ["config/importmap.rb", "app/assets/tailwind/theme/**/*"]

gates:
  style: "bin/rubocop {files}"
  security: "bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error"
  tests: "bin/rails test {files}"
  js: null
  all: "bin/ci"
  extra: []

checks:
  test_coverage_map: {}
  stimulus_wiring:
    controllers: ["app/javascript/controllers"]
  palette_leaks:
    exclude: ["app/assets/tailwind/theme/**/*"]

skills:
  root: .ai/skills
  house_note: >
    Verify route -> controller -> operation/query -> presenter -> view -> Stimulus/Turbo per endpoint; the theme pipeline
    (derivation, validation, export) lives in the theme concept and Ruby is the truth the live-preview JS mirrors; the
    LLM call is one structured, schema-parsed call behind a job with an injected client and its output is validated
    before use.

board:
  repo: null
  source: epic
  base: main
  branch: "epic/{epic}/{number}-{slug}"
  pr_title: "{title}"
  worktrees: "../{repo}-wt"
  stages: [plan, test-plan, build, gates, audit, fix, review, done]
  audit_min: 8
  fix_iterations: 3
  merge: human

agents:
  builder: senior-rails-dev
  specialised: []

golden:
  root: .claude/golden

# What /flow:audit-ux walks and judges. Tasks are goals in the user's words: never name the menu or the page.
# The walker changes data in the development database (it creates, publishes and deletes themes); `bin/rails db:seed`
# restores the three seed themes by name. Within a feature the tasks are walked in priority order, so "stop sharing"
# finds the theme the export task published.
ux:
  base_url: http://localhost:3000
  reset: "RAILS_ENV=development bin/rails db:seed:replant"   # truncates the development tables and reloads db/seeds.rb (Ocean, Forest, Sunset)
  viewports: [desktop]
  sign_in: null
  conventions: >
    One primary action per screen, rendered with the default Chadcn::Button; every color comes from the theme tokens;
    the editor saves only on Save (no autosave) while the preview updates live; destructive actions ask for confirmation
    in a Chadcn dialog; English only.
  skills: [design-system, accessibility]
  personas:
    - id: developer
      description: >
        A Rails developer who uses the chadcn gem and wants their app to look like their brand. Comfortable with code,
        not a designer: knows their brand color as a hex code (for example #1d4ed8), does not know color theory or
        what oklch means. On a laptop, first visit to the studio.
  features:
    - id: create
      tasks:
        - id: create-theme
          goal: "Make a new theme called Acme from my brand color, a strong blue"
          persona: developer
          priority: 1
          start: /
          resume_from: /themes
          done_when: "a theme named Acme exists in my brand color and I can see its colors applied to a page"
          budget: {clicks: 4, seconds: 40}
    - id: tune
      tasks:
        - id: round-corners
          goal: "Make the corners of my Ocean theme rounder and keep the change"
          persona: developer
          priority: 1
          start: /
          resume_from: /themes
          done_when: "the preview shows rounder corners and the change is saved"
          budget: {clicks: 6, seconds: 45}
        - id: preview-on-form
          goal: "See how my Ocean theme looks on a page with a form"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          done_when: "a form page is shown in the Ocean theme"
          budget: {clicks: 4}
        - id: check-dark-mode
          goal: "Check how my Ocean theme looks in dark mode"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          done_when: "a page is shown in the dark version of the Ocean theme"
          budget: {clicks: 4}
        - id: pin-one-color
          goal: "Make the borders of my Ocean theme a specific gray without changing the other colors"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          knows: "the gray is #9ca3af"
          done_when: "the borders use the gray I chose, the other colors are unchanged and the change is saved"
        - id: change-brand-color
          goal: "Change the main color of my Ocean theme to my new brand color and keep the change"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          knows: "the new brand color is #0f766e"
          done_when: "the preview uses the new color and the change is saved"
        - id: tint-surfaces
          goal: "Make the backgrounds and cards of my Ocean theme a little less gray, closer to its blue, and keep the change"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          done_when: "the backgrounds and cards are visibly tinted with the theme's blue and the change is saved"
    - id: generate
      tasks:
        - id: generate-from-description
          goal: "Get a theme for a calm, earthy coffee shop site without choosing any color myself"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          done_when: "a new theme made from my description is shown on a page"
    - id: export
      tasks:
        - id: get-import-command
          goal: "Get what I need to use my Ocean theme in my own Rails app"
          persona: developer
          priority: 1
          start: /
          resume_from: /themes
          done_when: "the command that imports the Ocean theme into an app is on screen and can be copied"
          budget: {clicks: 5, seconds: 40}
        - id: stop-sharing
          goal: "Share my Ocean theme publicly, then change my mind and stop sharing it"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          done_when: "the Ocean theme was shown as published and is now shown as not published"
        - id: download-css
          goal: "Download my Ocean theme as a theme.css file I can drop into my app"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          done_when: "a theme.css file of the Ocean theme has been downloaded"
    - id: library
      tasks:
        - id: reopen-theme
          goal: "Find the Forest theme I made earlier and continue editing it"
          persona: developer
          priority: 2
          start: /
          resume_from: /themes
          done_when: "the Forest theme is open and its settings can be changed"
          budget: {clicks: 2}
        - id: delete-theme
          goal: "Delete the Sunset theme, which I no longer want"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          done_when: "Sunset is no longer in my list of themes"
        - id: rename-theme
          goal: "Rename my Forest theme to Forest Green"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          done_when: "Forest Green is in my list of themes and Forest is not"
        - id: look-up-value
          goal: "Find the exact color my Ocean theme uses for its main color in dark mode"
          persona: developer
          priority: 3
          start: /
          resume_from: /themes
          done_when: "the dark-mode value of the Ocean theme's primary color is on screen"
    - id: gallery
      tasks:
        - id: browse-components
          goal: "See which components chadcn offers and what each one looks like"
          persona: developer
          priority: 3
          start: /
          resume_from: /gallery
          done_when: "the catalog of chadcn components is on screen, each shown rendered"
